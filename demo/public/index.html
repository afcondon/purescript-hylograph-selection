<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hylograph — The Hylographic Fold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000000;
      --near-black: #0a0a0a;
      --charcoal: #1a1a1a;
      --dark-panel: #111;
      --gold: #C9A962;
      --gold-dim: #8B7355;
      --gold-bright: #E8D5A3;
      --cream: #FAF8F5;
      --warm-white: #FFFEF9;
      --text-dark: #2a2a2a;
      --text-light: #e8e8e8;
      --text-muted: #888;
      --font-deco: 'Josefin Sans', sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }

    body {
      font-family: var(--font-deco);
      color: var(--text-light);
      background: var(--black);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ================================================================
       Chapter Layout — Full-screen pages
       ================================================================ */
    .chapter {
      min-height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      padding: 3rem 4rem;
      position: relative;
      border-bottom: 1px solid var(--gold-dim);
    }

    /* Gold dot terminals on chapter borders */
    .chapter::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
    }

    .chapter-number {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      margin-bottom: 0.5rem;
    }

    .chapter h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
      line-height: 1.15;
    }

    .chapter-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 48em;
      margin-bottom: 2rem;
      font-weight: 300;
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    /* ================================================================
       Visualization Panels
       ================================================================ */
    .viz-row {
      display: flex;
      gap: 2rem;
      flex: 1;
      align-items: stretch;
      min-height: 0;
    }

    .viz-panel {
      flex: 1;
      background: var(--cream);
      border: 1px solid var(--gold-dim);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .viz-panel.narrow { flex: 0 0 220px; }

    .viz-panel.dark {
      background: var(--dark-panel);
    }

    .viz-panel-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dim);
      padding: 0.75rem 1rem 0;
    }

    .viz-panel.dark .viz-panel-label {
      color: var(--gold-dim);
    }

    .viz-panel-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .viz-panel-content svg {
      max-width: 100%;
      max-height: 100%;
    }

    /* ================================================================
       Fold Arrow
       ================================================================ */
    .fold-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 50px;
      font-size: 1.5rem;
      color: var(--gold-dim);
      user-select: none;
    }

    /* ================================================================
       Navigation dots
       ================================================================ */
    nav.chapter-nav {
      position: fixed;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    nav.chapter-nav a {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-dim);
      display: block;
      transition: background 0.2s, transform 0.2s;
      text-decoration: none;
    }

    nav.chapter-nav a:hover,
    nav.chapter-nav a.active {
      background: var(--gold);
      transform: scale(1.4);
    }

    /* ================================================================
       Coordinated Highlighting
       ================================================================ */
    .highlight-primary {
      opacity: 1 !important;
      stroke: var(--gold) !important;
      stroke-width: 2.5px !important;
    }

    .highlight-related {
      opacity: 0.9 !important;
      stroke: var(--gold-bright) !important;
      stroke-width: 1.5px !important;
    }

    .highlight-dimmed {
      opacity: 0.15 !important;
      transition: opacity 0.15s;
    }

    /* ================================================================
       Scroll hint
       ================================================================ */
    .scroll-hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-dim);
      opacity: 0.5;
      pointer-events: none;
    }

    /* ================================================================
       Responsive
       ================================================================ */
    @media (max-width: 1200px) {
      .chapter { padding: 2rem; }
      .chapter h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="scroll-hint">Scroll to continue</div>
  <script type="module" src="bundle.js"></script>
</body>
</html>
