package:
  name: hylograph-selection-demo
  description: Hylograph Explorer - Interactive HATS tree visualization demo
  dependencies:
    - aff: ">=8.0.0 <9.0.0"
    - arrays: ">=7.3.0 <8.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - halogen: ">=7.0.0 <8.0.0"
    - halogen-subscriptions: ">=2.0.0 <3.0.0"
    - hylograph-selection: "*"
    - integers: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - web-dom: ">=6.0.0 <7.0.0"
    - web-events: ">=4.0.0 <5.0.0"
    - web-html: ">=4.1.1 <5.0.0"
    - web-uievents: ">=5.0.0 <6.0.0"
  build:
    strict: true

  bundle:
    module: Main
    outfile: public/bundle.js
    platform: browser
