<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hylograph — The Hylographic Fold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ================================================================
       Swiss Typographic Style — Light Theme
       ================================================================ */
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --fg-secondary: #555;
      --fg-tertiary: #999;
      --accent: #2563eb;
      --border: #e0e0e0;
      --panel-bg: #fff;
      --code-bg: #f5f5f0;
      --highlight-primary: #fbbf24;
      --highlight-related: #60a5fa;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }

    body {
      font-family: var(--font-sans);
      color: var(--fg);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ================================================================
       Chapter Layout — Full-screen pages
       ================================================================ */
    .chapter {
      min-height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      padding: 3rem 4rem;
      position: relative;
    }

    .chapter-number {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--fg-tertiary);
      margin-bottom: 0.5rem;
    }

    .chapter h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      line-height: 1.15;
    }

    .chapter-subtitle {
      font-size: 1.05rem;
      color: var(--fg-secondary);
      max-width: 48em;
      margin-bottom: 2rem;
      font-weight: 300;
      line-height: 1.7;
    }

    /* ================================================================
       Visualization Panels
       ================================================================ */
    .viz-row {
      display: flex;
      gap: 2rem;
      flex: 1;
      align-items: stretch;
      min-height: 0;
    }

    .viz-panel {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .viz-panel.narrow { flex: 0 0 220px; }

    .viz-panel-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--fg-tertiary);
      padding: 0.75rem 1rem 0;
    }

    .viz-panel-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .viz-panel-content svg {
      max-width: 100%;
      max-height: 100%;
    }

    /* ================================================================
       Navigation dots
       ================================================================ */
    nav.chapter-nav {
      position: fixed;
      right: 1.5rem;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    nav.chapter-nav a {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      display: block;
      transition: background 0.2s, transform 0.2s;
      text-decoration: none;
    }

    nav.chapter-nav a:hover,
    nav.chapter-nav a.active {
      background: var(--fg);
      transform: scale(1.4);
    }

    /* ================================================================
       Fold Arrow (visual separator between data and output)
       ================================================================ */
    .fold-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 60px;
      font-size: 2rem;
      color: var(--fg-tertiary);
      user-select: none;
    }

    /* ================================================================
       Coordinated Highlighting (CSS from the library)
       ================================================================ */
    .highlight-primary {
      opacity: 1 !important;
      stroke: var(--highlight-primary) !important;
      stroke-width: 2.5px !important;
    }

    .highlight-related {
      opacity: 0.9 !important;
      stroke: var(--highlight-related) !important;
      stroke-width: 1.5px !important;
    }

    .highlight-dimmed {
      opacity: 0.15 !important;
      transition: opacity 0.15s;
    }

    /* ================================================================
       Scroll hint
       ================================================================ */
    .scroll-hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--fg-tertiary);
      letter-spacing: 0.08em;
      opacity: 0.5;
      pointer-events: none;
    }

    /* ================================================================
       Responsive (minimal — wide-screen optimized)
       ================================================================ */
    @media (max-width: 1200px) {
      .chapter { padding: 2rem; }
      .chapter h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="scroll-hint">Scroll to continue</div>
  <script type="module" src="bundle.js"></script>
</body>
</html>
